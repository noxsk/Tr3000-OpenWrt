name: Build TR3000

on:
  workflow_dispatch:
  schedule:
    # 02:00 Asia/Shanghai. GitHub runs this in UTC and may start late.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: tr3000-firmware
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}/.build/immortalwrt-mt798x-rebase
      DL_CACHE: ${{ github.workspace }}/.build/dl-cache
      CCACHE_DIR: ${{ github.workspace }}/.build/ccache
      USE_CCACHE: "1"
    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .build/dl-cache
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .build/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves
          mkdir -p "$CCACHE_DIR" "$DL_CACHE"

      - name: Compile
        run: ./scripts/build.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-logs-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            .build/immortalwrt-mt798x-rebase/logs/**
            .build/build-manifest.txt

      - name: Upload firmware and kmods
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-128m-112m-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: .build/artifact/**

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/dl-cache
          key: dl-${{ github.run_id }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/ccache
          key: ccache-${{ github.run_id }}
